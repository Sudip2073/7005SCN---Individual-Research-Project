name: DevSecOps CI — Build, Scan, Sign, Attest & Push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  

jobs:
  build-scan-sign-push:
    runs-on: ubuntu-latest

    permissions:
      actions: read       # required by upload-sarif telemetry/workflow-run lookup
      contents: read      # checkout repo
      packages: write     # push to GHCR
      id-token: write     # REQUIRED: GitHub OIDC token for Cosign keyless signing
      security-events: write

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-ref: ${{ steps.image-ref.outputs.ref }}

    steps:

      # ──────────────────────────────────────────────
      # STAGE 0 — Verify signed git commit
      # Checks that the HEAD commit carries a GPG or SSH signature.
      # To enable locally: git config --global commit.gpgsign true
      # Upload your public key to GitHub → Settings → SSH and GPG keys
      # Then enable "Vigilant Mode" in GitHub → Settings → SSH and GPG keys
      # ──────────────────────────────────────────────

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for commit signature verification

      - name: Verify Git Commit Signature
        # continue-on-error: remove this line once all contributors have signing configured
        continue-on-error: true
        run: |
          echo "=== Commit Provenance Check ==="
          COMMIT_SHA=$(git log -1 --format="%H" HEAD)
          SIGNER=$(git log -1 --format="%GS" HEAD)
          STATUS=$(git log -1 --format="%G?" HEAD)
          echo "Commit : ${COMMIT_SHA}"
          echo "Signer : ${SIGNER:-none}"
          echo "Status : ${STATUS}"
          if [ "$STATUS" = "G" ]; then
            echo "PASS: Commit signed with a valid, trusted key."
          elif [ "$STATUS" = "E" ]; then
            echo "PASS: Commit signed (key expired but signature is valid)."
          elif [ "$STATUS" = "U" ]; then
            echo "WARN: Commit is signed but key is not in the trusted keyring."
          else
            echo "WARN: Commit is NOT signed. Configure: git config --global commit.gpgsign true"
          fi

      # ──────────────────────────────────────────────
      # STAGE 1 — Build toolchain
      # ──────────────────────────────────────────────

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare container image name
        id: image
        shell: bash
        run: |
          REGISTRY="$(echo "${{ env.REGISTRY }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "full=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Using image reference: ${REGISTRY}/${IMAGE_NAME}"

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Immutable SHA Tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.full }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # ──────────────────────────────────────────────
      # STAGE 2 — Build image locally only (no push yet)
      # Scan BEFORE any push so a vulnerable image never reaches GHCR
      # ──────────────────────────────────────────────

      - name: Build Docker Image (Local — Pre-Scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ──────────────────────────────────────────────
      # STAGE 3 — Dual-format SBOM generation
      # CycloneDX → Kyverno attestation policy target
      # SPDX      → Academic documentation + UK SSCoP / NIST SSDF regulatory alignment
      # ──────────────────────────────────────────────

      - name: Generate SBOM — CycloneDX 1.4 JSON
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          # artifact-name: sbom-cyclonedx-${{ github.sha }}

      - name: Generate SBOM — SPDX JSON
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom.spdx.json
          # artifact-name: sbom-spdx-${{ github.sha }}

      # ──────────────────────────────────────────────
      # STAGE 4 — Vulnerability scan (policy gate)
      # Gate: pipeline FAILS on HIGH or CRITICAL CVEs
      # Table → human readable in Actions log
      # SARIF  → machine-readable, uploaded to GitHub Security tab
      #          (citable evidence for thesis methodology chapter)
      # ──────────────────────────────────────────────

      - name: Vulnerability Scan — Table (Actions Log)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          # exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          cache-dir: .cache/trivy

      - name: Vulnerability Scan — SARIF (GitHub Security Tab)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          cache-dir: .cache/trivy

      - name: Upload SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          

      # ──────────────────────────────────────────────
      # STAGE 5 — Push verified image to GHCR
      # Only reached if Trivy returns exit code 0 (no HIGH/CRITICAL CVEs).
      # Push MUST happen before Cosign — Cosign signs the remote OCI digest,
      # which does not exist until after the image is pushed.
      # ──────────────────────────────────────────────

      - name: Push Verified Image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Capture Immutable Image Reference
        id: image-ref
        run: |
          IMAGE_PATH=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="${IMAGE_PATH}@${{ steps.push.outputs.digest }}"
          echo "ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "=== Signing target ==="
          echo "${IMAGE_REF}"

      # ──────────────────────────────────────────────
      # STAGE 6 — Cosign keyless signing (SLSA L2 provenance)
      # Identity chain: GitHub Actions OIDC token
      #   → Fulcio CA issues short-lived signing certificate
      #   → Image digest signed
      #   → Rekor appends permanent transparency log entry
      # The .sig OCI artifact is pushed to GHCR alongside the image.
      # No private keys stored anywhere.
      # ──────────────────────────────────────────────

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign Image Digest (Keyless — GitHub OIDC / Sigstore)
        env:
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
        run: |
          echo "=== Cosign Keyless Signing ==="
          echo "Target : ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"
          echo "Signature pushed to GHCR as .sig OCI artifact"
          echo "Rekor transparency log entry created"

      # ──────────────────────────────────────────────
      # STAGE 7 — in-toto SBOM attestation
      # Attaches the CycloneDX SBOM as a signed in-toto attestation.
      # Creates a .att OCI artifact in GHCR.
      # This is what Kyverno's attestation ClusterPolicy verifies at admission.
      # ──────────────────────────────────────────────

      - name: Attest SBOM — CycloneDX in-toto Attestation
        env:
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
        run: |
          echo "=== Cosign SBOM Attestation ==="
          echo "Target    : ${IMAGE_REF}"
          echo "Predicate : sbom.cyclonedx.json (CycloneDX 1.4)"
          cosign attest \
            --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            "${IMAGE_REF}"
          echo "SBOM attestation pushed to GHCR as .att OCI artifact"

      # ──────────────────────────────────────────────
      # STAGE 8 — SLSA v1.0 provenance attestation
      # Documents: which workflow built this, which commit, which runner.
      # Formally satisfies SLSA Build L2 requirements.
      # ──────────────────────────────────────────────

      - name: Generate & Attest SLSA Provenance
        env:
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cat > slsa-provenance.json << EOF
          {
            "builder": {
              "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            },
            "buildType": "https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": ".github/workflows/devsecops-pipeline.yaml"
              },
              "parameters": {
                "event_name": "${{ github.event_name }}",
                "ref": "${{ github.ref }}",
                "run_id": "${{ github.run_id }}",
                "run_attempt": "${{ github.run_attempt }}",
                "actor": "${{ github.actor }}"
              },
              "environment": {}
            },
            "metadata": {
              "buildInvocationID": "${{ github.run_id }}"
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            ]
          }
          EOF

          cosign attest \
            --yes \
            --predicate slsa-provenance.json \
            --type slsaprovenance \
            "${IMAGE_REF}"

      # ──────────────────────────────────────────────
      # STAGE 9 — Upload all artefacts (thesis appendix evidence)
      #   sbom.cyclonedx.json  — Kyverno attestation + CVE analysis
      #   sbom.spdx.json       — Regulatory alignment (UK SSCoP / NIST SSDF)
      #   trivy-results.sarif  — CVE scan evidence
      #   slsa-provenance.json — SLSA L2 provenance document
      # ──────────────────────────────────────────────

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: Upload SPDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Upload SLSA Provenance Document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slsa-provenance-${{ github.sha }}
          path: slsa-provenance.json
          retention-days: 90
          
      - name: Upload Trivy SARIF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 90

      # ──────────────────────────────────────────────
      # STAGE 10 — Job summary
      # Copy the signed image reference into your thesis appendix.
      # Use the cosign verify commands below to reproduce results.
      # ──────────────────────────────────────────────

      - name: Write Pipeline Summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## DevSecOps Pipeline — Run Summary

          | Item | Value |
          |------|-------|
          | Commit SHA | \`${{ github.sha }}\` |
          | Image digest | \`${{ steps.push.outputs.digest }}\` |
          | Signed image ref | \`${{ steps.image-ref.outputs.ref }}\` |
          | Trivy gate | HIGH + CRITICAL — zero found |
          | SBOM formats | CycloneDX 1.4 JSON + SPDX 2.3 JSON |
          | Signing method | Keyless (GitHub OIDC → Fulcio → Rekor) |
          | Attestations | in-toto CycloneDX SBOM + SLSA v1.0 provenance |
          | GHCR artifacts | image + .sig + .att |
          | Run URL | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

          ### Reproduce verification locally

          \`\`\`bash
          export IMAGE="${{ steps.image-ref.outputs.ref }}"
          export IDENTITY_REGEXP="https://github.com/${{ github.repository }}/*"
          export OIDC_ISSUER="https://token.actions.githubusercontent.com"

          # 1. Verify image signature
          cosign verify \
            --certificate-identity-regexp="${IDENTITY_REGEXP}" \
            --certificate-oidc-issuer="${OIDC_ISSUER}" \
            "${IMAGE}"

          # 2. Verify CycloneDX SBOM attestation
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity-regexp="${IDENTITY_REGEXP}" \
            --certificate-oidc-issuer="${OIDC_ISSUER}" \
            "${IMAGE}"

          # 3. Verify SLSA provenance attestation
          cosign verify-attestation \
            --type slsaprovenance1 \
            --certificate-identity-regexp="${IDENTITY_REGEXP}" \
            --certificate-oidc-issuer="${OIDC_ISSUER}" \
            "${IMAGE}"
          \`\`\`
          EOF