name: CICD — Build, Scan, Sign, Attest & Push

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: CICD-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  build-scan-sign-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write
      actions: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate required configuration
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY}" ]; then
            echo "::error::Repository variable REGISTRY is not set"
            exit 1
          fi
          if [ -z "${IMAGE_NAME}" ]; then
            echo "::error::Repository variable IMAGE_NAME is not set"
            exit 1
          fi
          echo "Registry: ${REGISTRY}"
          echo "Image: ${IMAGE_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare container image name
        id: image
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          REGISTRY="$(echo "${REGISTRY}" | tr '[:upper:]' '[:lower:]' | sed 's:/*$::')"
          IMAGE_NAME="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's:^/*::; s:/*$::')"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "full=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Using image reference: ${REGISTRY}/${IMAGE_NAME}"

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.full }}

      - name: Push Verified Image to GHCR
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
