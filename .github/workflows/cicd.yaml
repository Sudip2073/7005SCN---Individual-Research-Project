name: DevSecOps CI - Build, Scan, and Registry Push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the GitHub UI for testing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/secure-app

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    
    # Strictly scope permissions for zero-trust security
    permissions:
      contents: read
      packages: write 
      id-token: write # Required for GHCR authentication
    
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-ref: ${{ steps.image-ref.outputs.ref }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # Fetch all history for provenance tracking

      - name: Verify Git Commit Signature
        # Verifies the HEAD commit is GPG or SSH signed.
        # Remove the `continue-on-error` line once all contributors have signing configured.
        continue-on-error: true
        run: |
          echo "=== Commit Provenance Check ==="
          git log -1 --format="%H %GS %G?" HEAD
          SIGNATURE_STATUS=$(git log -1 --format="%G?" HEAD)
          if [ "$SIGNATURE_STATUS" = "G" ] || [ "$SIGNATURE_STATUS" = "E" ]; then
            echo "PASS: Commit is signed and verified."
          elif [ "$SIGNATURE_STATUS" = "U" ]; then
            echo "WARN: Commit is signed but key is not in trusted keyring."
          else
            echo "WARN: Commit is NOT signed. Enable GPG/SSH signing locally."
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0 pinned SHA

      - name: Authenticate to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0 pinned SHA
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags using the exact Git commit SHA for strict provenance tracking
      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbea8d7f8d6898f07b6c0b3d8b79  # v5.7.0 pinned SHA
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

#----------------------------------------------
      # Build but do NOT push yet. Load locally for vulnerability scanning
      - name: Build Docker Image (Local Load)
        uses: docker/build-push-action@14487ce63c7a62a4a324b0b6a545221b4f3c0f60  # v6.16.0 pinned SHA
        with:
          context: .
          load: true 
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM — CycloneDX 1.4 JSON (Kyverno attestation target)
        uses: anchore/sbom-action@e11e49b0d3bec8abe4c4d0e8af2c546cc8560b28  # v0.20.0 pinned SHA
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom-cyclonedx

      - name: Generate SBOM — SPDX JSON (regulatory / academic documentation)
        uses: anchore/sbom-action@e11e49b0d3bec8abe4c4d0e8af2c546cc8560b28  # v0.20.0 pinned SHA
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx

      # The Gating Mechanism: Pipeline dies here if a critical CVE is found
      - name: Vulnerability Scan — Table Output (Actions Log)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.30.0 pinned SHA
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'   # UPDATED: gates on both HIGH and CRITICAL
 
      - name: Vulnerability Scan — SARIF Output (GitHub Security Tab)
        if: always()    # run even on failure so SARIF is always uploaded for evidence
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.30.0 pinned SHA
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
 
      - name: Upload SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@45775bd8235c68ba998cffa5171334d58593da47  # v3.28.15 pinned SHA
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan

      # Only executes if Trivy returns an exit code of 0 (no critical CVEs)
      - name: Push Verified Image to GHCR
        id: push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0b6a545221b4f3c0f60  # v6.16.0 pinned SHA
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # outputs the immutable sha256 digest — used by all subsequent Cosign steps
          # format: ghcr.io/org/repo/image@sha256:<digest>
 
      - name: Capture Immutable Image Reference
        id: image-ref
        run: |
          # Construct the digest-pinned reference — never use a mutable tag for signing
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          echo "ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "=== Image reference for signing ==="
          echo "${IMAGE_REF}"
 
      # ──────────────────────────────────────────────
      # STAGE 6 — Cosign keyless signing (SLSA L2 provenance)
      # Uses GitHub Actions OIDC token as identity (no private keys stored anywhere).
      # Flow: GitHub OIDC → Fulcio CA issues short-lived cert → signs image digest
      #       → Rekor appends a permanent, tamper-evident transparency log entry
      # The .sig OCI artifact is pushed to GHCR alongside the image automatically.
      # ──────────────────────────────────────────────
 
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a  # v3.8.1 pinned SHA
 
      - name: Sign Image Digest — Keyless via GitHub OIDC / Sigstore
        env:
          # Digest-pinned reference — immutable, what Kyverno policy verifies
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
        run: |
          echo "=== Cosign Keyless Signing ==="
          echo "Signing: ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"
          echo "=== Signature pushed to GHCR as .sig OCI artifact ==="
          echo "=== Rekor transparency log entry created ==="
 
      # ──────────────────────────────────────────────
      # STAGE 7 — Cosign in-toto attestation
      # Attaches the CycloneDX SBOM as a cryptographically signed in-toto attestation.
      # This creates a .att OCI artifact in GHCR that Kyverno's attestation policy verifies.
      # The predicate-type cyclonedx tells Kyverno how to interpret the payload.
      # ──────────────────────────────────────────────
 
      - name: Attest SBOM — CycloneDX in-toto Attestation
        env:
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
        run: |
          echo "=== Cosign SBOM Attestation ==="
          echo "Attesting: ${IMAGE_REF}"
          echo "Predicate: sbom.cyclonedx.json (CycloneDX 1.4)"
          cosign attest \
            --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            "${IMAGE_REF}"
          echo "=== SBOM attestation pushed to GHCR as .att OCI artifact ==="
 
      # ──────────────────────────────────────────────
      # STAGE 8 — SLSA L2 provenance attestation
      # Generates a signed SLSA provenance document describing:
      #   - which GitHub Actions workflow built this image
      #   - the exact commit SHA
      #   - the builder identity (GitHub Actions)
      # This is the document that formally satisfies SLSA Build L2 requirements.
      # ──────────────────────────────────────────────
 
      - name: Generate SLSA L2 Provenance Attestation
        env:
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "=== SLSA Provenance Attestation ==="
          # Generate a SLSA v1.0 provenance predicate locally
          # In production, use slsa-github-generator for full SLSA L3.
          # For SLSA L2 (this thesis), we attest builder metadata via cosign.
          cat > slsa-provenance.json << EOF
          {
            "_type": "https://in-toto.io/Statement/v0.1",
            "predicateType": "https://slsa.dev/provenance/v1",
            "subject": [{
              "name": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",
              "digest": { "sha256": "${DIGEST#sha256:}" }
            }],
            "predicate": {
              "buildDefinition": {
                "buildType": "https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1",
                "externalParameters": {
                  "workflow": {
                    "ref": "${{ github.ref }}",
                    "repository": "${{ github.repository }}",
                    "path": ".github/workflows/devsecops-pipeline.yml"
                  }
                },
                "internalParameters": {
                  "github": {
                    "event_name": "${{ github.event_name }}",
                    "run_id": "${{ github.run_id }}",
                    "run_attempt": "${{ github.run_attempt }}",
                    "sha": "${{ github.sha }}",
                    "actor": "${{ github.actor }}"
                  }
                }
              },
              "runDetails": {
                "builder": {
                  "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                },
                "metadata": {
                  "invocationId": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              }
            }
          }
          EOF
 
          cosign attest \
            --yes \
            --predicate slsa-provenance.json \
            --type slsaprovenance1 \
            "${IMAGE_REF}"
          echo "=== SLSA L2 provenance attestation pushed to GHCR ==="
 
      # ──────────────────────────────────────────────
      # STAGE 9 — Upload all artefacts for academic documentation
      # These files form your thesis appendix evidence:
      #   - sbom.cyclonedx.json  → Kyverno attestation + vulnerability analysis
      #   - sbom.spdx.json       → Regulatory alignment (UK SSCoP / NIST SSDF)
      #   - trivy-results.sarif  → CVE scan evidence (also in GitHub Security tab)
      #   - slsa-provenance.json → SLSA L2 provenance document
      # ──────────────────────────────────────────────
 
      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 pinned SHA
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90
 
      - name: Upload SPDX SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 pinned SHA
        with:
          name: sbom-spdx-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90
 
      - name: Upload SLSA Provenance Document
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 pinned SHA
        with:
          name: slsa-provenance-${{ github.sha }}
          path: slsa-provenance.json
          retention-days: 90
 
      # ──────────────────────────────────────────────
      # STAGE 10 — Pipeline summary
      # Writes a structured summary to the GitHub Actions job summary page.
      # Copy the image reference into your thesis appendix.
      # ──────────────────────────────────────────────
 
      - name: Write Pipeline Summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## DevSecOps Pipeline — Run Summary
 
          | Item | Value |
          |------|-------|
          | Commit SHA | \`${{ github.sha }}\` |
          | Image digest | \`${{ steps.push.outputs.digest }}\` |
          | Signed image ref | \`${{ steps.image-ref.outputs.ref }}\` |
          | Trivy gate | HIGH + CRITICAL (zero found) |
          | SBOM formats | CycloneDX 1.4 JSON + SPDX JSON |
          | Cosign signing | Keyless (GitHub OIDC → Fulcio → Rekor) |
          | Attestation | in-toto CycloneDX SBOM + SLSA v1.0 provenance |
          | GHCR artifacts | image (\`\`) + signature (\`.sig\`) + attestation (\`.att\`) |
          | Run URL | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
 
          ### Verify this image locally
          \`\`\`bash
          # Verify signature
          cosign verify \\
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/*" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            ${{ steps.image-ref.outputs.ref }}
 
          # Verify SBOM attestation
          cosign verify-attestation \\
            --type cyclonedx \\
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/*" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            ${{ steps.image-ref.outputs.ref }}
          \`\`\`
          EOF